<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A4A">
  <title>Suivi affaires</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js"></script>
</head>
<body>
  <!-- Écran de connexion -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand-mark" aria-hidden="true">SA</div>
      <h1>Suivi affaires</h1>
      <p class="muted">Du rendez-vous à la facture, sans rien oublier.</p>
      <div id="gbtn" class="gbtn"></div>
      <p id="login-msg" class="login-msg" role="alert"></p>
      <p class="login-foot">par So Conseiller</p>
    </div>
  </section>

  <!-- Application -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Ouvrir le menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="topbar-title">Suivi affaires</span>
      <button class="icon-btn" data-act="refresh" aria-label="Actualiser">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <nav id="nav" class="nav" aria-label="Menu principal"></nav>
    <div class="nav-scrim" id="nav-scrim"></div>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="loader" class="loader" hidden><span></span></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>

  <script src="app.js"></script>
</body>
</html>
